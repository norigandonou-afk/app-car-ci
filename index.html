/* ============ AUTODEAL CI — Design system ============ */
:root{
  --bg:#FFFFFF;--surface:#F4F4F4;--surface-2:#FFFFFF;--text:#111111;--text-muted:#5C5C5C;
  --brand:#FF6B00;--brand-hover:#E55F00;--brand-ink:#B34700;--on-brand:#111111;
  --border:#E4E4E4;--success:#1E9E5A;--success-ink:#17794A;--danger:#D93025;--danger-ink:#C5221F;
  --ink:#111111;--on-ink:#FFFFFF;--photo-bg:#E9E9E9;
  --shadow-1:0 1px 2px rgba(17,17,17,.06),0 2px 8px rgba(17,17,17,.05);
  --shadow-2:0 4px 12px rgba(17,17,17,.08),0 12px 32px rgba(17,17,17,.08);
  --r-card:12px;--r-field:8px;--r-pill:999px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;--s12:48px;--s16:64px;
  --fs-xs:.75rem;--fs-sm:.875rem;--fs-base:1rem;--fs-md:1.125rem;--fs-lg:1.375rem;--fs-xl:1.75rem;--fs-2xl:2.25rem;--fs-3xl:3rem;
  --font-title:'Sora',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-text:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --t:200ms ease-out;--nav-h:64px;--top-h:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#111111;--surface:#1B1B1B;--surface-2:#242424;--text:#FFFFFF;--text-muted:#A8A8A8;
  --brand-hover:#FF8533;--brand-ink:#FF8533;--border:#333333;--success:#35C27A;--success-ink:#35C27A;--danger:#FF6B5E;--danger-ink:#FF6B5E;
  --ink:#242424;--photo-bg:#2A2A2A;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 8px 28px rgba(0,0,0,.5);color-scheme:dark;}}
:root[data-theme=dark]{
  --bg:#111111;--surface:#1B1B1B;--surface-2:#242424;--text:#FFFFFF;--text-muted:#A8A8A8;
  --brand-hover:#FF8533;--brand-ink:#FF8533;--border:#333333;--success:#35C27A;--success-ink:#35C27A;--danger:#FF6B5E;--danger-ink:#FF6B5E;
  --ink:#242424;--photo-bg:#2A2A2A;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);--shadow-2:0 8px 28px rgba(0,0,0,.5);color-scheme:dark;}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-base)/1.5 var(--font-text);-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--font-title);line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:var(--fs-xl);font-weight:800}h2{font-size:var(--fs-lg);font-weight:700}h3{font-size:var(--fs-md);font-weight:700}h4{font-size:var(--fs-base);font-weight:700}
p{margin:0}a{color:inherit;text-decoration:none}
img,svg,video{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
ul,ol{margin:0;padding:0;list-style:none}
table{border-collapse:collapse;width:100%}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--on-brand);padding:12px 16px;border-radius:8px;font-weight:700;z-index:200}
.skip:focus{top:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

.container{width:100%;max-width:1200px;margin-inline:auto;padding-inline:var(--s4)}
.muted{color:var(--text-muted)}.small{font-size:var(--fs-sm)}.xs{font-size:var(--fs-xs)}
.link{color:var(--brand-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;gap:var(--s2)}.row-wrap{flex-wrap:wrap}.between{justify-content:space-between}
.stack{display:grid;gap:var(--s4)}.stack-sm{display:grid;gap:var(--s2)}.grow{flex:1;min-width:0}
.ic{display:inline-block;vertical-align:-.22em;width:20px;height:20px;flex:none}.ic-sm{width:16px;height:16px;vertical-align:-.18em}.ic-lg{width:24px;height:24px}.ic-xl{width:32px;height:32px}
.nowrap{white-space:nowrap}.center{text-align:center}

/* ---- Logo ---- */
.logo{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-title);font-weight:800;font-size:1.125rem;letter-spacing:.02em;min-height:44px}
.logo .ci{background:var(--brand);color:var(--on-brand);padding:2px 6px;border-radius:5px;font-size:.8125rem;transform:skewX(-10deg)}
.logo .ci b{display:inline-block;transform:skewX(10deg)}
.logo-mono{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;background:var(--brand);color:var(--on-brand);font:800 .9375rem var(--font-title);letter-spacing:.01em}

/* ---- Motif : trait diagonal / route ---- */
.slash{display:inline-block;width:10px;height:22px;background:var(--brand);transform:skewX(-18deg);border-radius:2px;flex:none}
.road{height:4px;border:0;margin:var(--s8) 0;background:repeating-linear-gradient(90deg,var(--brand) 0 28px,transparent 28px 44px);opacity:.9;border-radius:2px;max-width:220px}
.road.center{margin-inline:auto}

/* ---- Boutons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-field);font-weight:700;font-size:var(--fs-base);border:1.5px solid transparent;transition:background var(--t),border-color var(--t),transform var(--t),color var(--t);text-align:center;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:var(--on-brand)}.btn-primary:hover{background:var(--brand-hover)}
.btn-dark{background:var(--text);color:var(--bg)}.btn-dark:hover{opacity:.88}
.btn-outline{border-color:var(--border);background:var(--surface-2);color:var(--text)}.btn-outline:hover{border-color:var(--text)}
.btn-ghost{color:var(--text)}.btn-ghost:hover{background:var(--surface)}
.btn-danger{border-color:var(--danger);color:var(--danger-ink);background:transparent}.btn-danger:hover{background:var(--danger);color:#fff}
:root[data-theme=dark] .btn-danger:hover{color:#111}
.btn-sm{min-height:36px;padding:6px 12px;font-size:var(--fs-sm)}
.btn-lg{min-height:52px;padding:14px 24px;font-size:var(--fs-md)}
.btn-block{width:100%}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;transform:none}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;position:relative;transition:background var(--t);flex:none}
.icon-btn:hover{background:var(--surface)}
.dot{position:absolute;top:6px;right:6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--brand);color:var(--on-brand);font-size:11px;font-weight:800;display:grid;place-items:center;border:2px solid var(--bg)}

/* ---- Chips / badges ---- */
.chip{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-pill);border:1.5px solid var(--border);background:var(--surface-2);font-weight:600;font-size:var(--fs-sm);white-space:nowrap;transition:all var(--t)}
.chip:hover{border-color:var(--text)}
.chip[aria-pressed=true],.chip[aria-current=true],.chip.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;line-height:1.3;white-space:nowrap}
.badge .ic{width:13px;height:13px}
.badge-new{background:var(--brand);color:var(--on-brand)}
.badge-verified{background:#111;color:#fff}.badge-verified .ic{color:var(--brand)}
.badge-sold{background:var(--danger);color:#fff}
.badge-feat{background:#fff;color:#111;border:1px solid #111}
.st{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:var(--r-pill);font-size:var(--fs-xs);font-weight:700;background:var(--surface);border:1px solid var(--border)}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--text-muted)}
.st-publiee::before,.st-confirme::before,.st-active::before,.st-actif::before,.st-traite::before{background:var(--success)}
.st-en_attente::before,.st-ouvert::before{background:var(--brand)}
.st-refusee::before,.st-suspendu::before,.st-rejete::before{background:var(--danger)}
.st-vendue::before{background:var(--text)}

/* ---- Formulaires ---- */
.field{display:grid;gap:6px;min-width:0}
.field>label,.label{font-weight:600;font-size:var(--fs-sm)}
.req{color:var(--danger-ink)}
.input,.select,.textarea{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--r-field);background:var(--surface-2);color:var(--text);transition:border-color var(--t)}
.textarea{min-height:120px;resize:vertical}
.input:hover,.select:hover,.textarea:hover{border-color:var(--text-muted)}
.input:focus,.select:focus,.textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.input[aria-invalid=true],.select[aria-invalid=true],.textarea[aria-invalid=true]{border-color:var(--danger)}
.err{color:var(--danger-ink);font-size:var(--fs-sm);font-weight:600}
.hint{color:var(--text-muted);font-size:var(--fs-sm)}
.check{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:10px 0;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand);flex:none;margin:2px 0 0}
.form-grid{display:grid;gap:var(--s4);grid-template-columns:1fr}
@media(min-width:640px){.form-grid.cols-2{grid-template-columns:1fr 1fr}.form-grid.cols-3{grid-template-columns:repeat(3,1fr)}}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r-field);background:var(--surface);border:1px solid var(--border);font-size:var(--fs-sm)}
.alert .ic{margin-top:1px}
.alert-warn{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--bg))}
.alert-danger{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 8%,var(--bg))}
.alert-ok{border-color:var(--success);background:color-mix(in srgb,var(--success) 10%,var(--bg))}

/* ---- Cartes ---- */
.card{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--shadow-1)}
.card-pad{padding:var(--s4)}
@media(min-width:640px){.card-pad{padding:var(--s6)}}
.panel{background:var(--surface);border-radius:var(--r-card);padding:var(--s4)}

/* ---- En-tête ---- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.topbar-in{display:flex;align-items:center;gap:var(--s2);height:var(--top-h)}
.topnav{display:none;gap:var(--s1);margin-left:var(--s6)}
.topnav a{display:inline-flex;align-items:center;min-height:44px;padding:0 12px;border-radius:8px;font-weight:600;font-size:var(--fs-sm);color:var(--text-muted);transition:color var(--t),background var(--t)}
.topnav a:hover{color:var(--text);background:var(--surface)}
.topnav a[aria-current=page]{color:var(--text);box-shadow:inset 0 -3px 0 var(--brand);border-radius:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:2px}
.desk-only{display:none!important}
@media(min-width:960px){:root{--top-h:68px}.topnav{display:flex}.desk-only{display:inline-flex!important}.mob-only{display:none!important}}
.strip{font-size:var(--fs-xs);text-align:center;padding:5px 12px;background:var(--surface);color:var(--text-muted);border-bottom:1px solid var(--border)}
.strip b{color:var(--text)}
.strip-off{background:var(--danger);color:#fff;font-weight:700;font-size:var(--fs-sm)}

/* ---- Barre basse mobile ---- */
.bottomnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:60;height:var(--nav-h);background:#111;color:#fff;border-radius:20px;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center;box-shadow:0 8px 28px rgba(0,0,0,.32);border:1px solid #2c2c2c}
.bottomnav a{display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:600;color:#c9c9c9;min-height:48px;align-content:center;border-radius:12px}
.bottomnav a[aria-current=page]{color:#fff}
.bottomnav a[aria-current=page] .ic{color:var(--brand)}
.bottomnav .fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#111;display:grid;place-items:center;margin:-22px auto 0;border:4px solid var(--bg);box-shadow:0 6px 16px rgba(255,107,0,.4);transition:transform var(--t)}
.bottomnav .fab:active{transform:scale(.94)}
.bottomnav .fab .ic{width:26px;height:26px;stroke-width:2.6}
main{min-height:60vh;padding-bottom:calc(var(--nav-h) + 40px)}
@media(min-width:960px){.bottomnav{display:none}main{padding-bottom:var(--s12)}}
body.is-detail .bottomnav{display:none}
.cmp-pill{position:fixed;right:16px;bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom));z-index:55;box-shadow:var(--shadow-2)}
body.is-detail .cmp-pill{bottom:92px}
@media(min-width:960px){.cmp-pill,body.is-detail .cmp-pill{bottom:24px}}

/* ---- Sections ---- */
.section{padding-block:var(--s6)}
@media(min-width:960px){.section{padding-block:var(--s8)}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.sec-title{display:flex;align-items:center;gap:10px}
.see-all{display:inline-flex;align-items:center;min-height:44px;color:var(--brand-ink);font-weight:700;font-size:var(--fs-sm);white-space:nowrap}
.hscroll{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x proximity;padding:4px var(--s4) 12px;margin-inline:calc(var(--s4) * -1);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.hscroll .vcard{width:min(46vw,250px)}
@media(max-width:359px){.hscroll .vcard{width:78vw}}

/* ---- Accueil ---- */
.greet{display:flex;align-items:center;gap:var(--s3);padding-block:var(--s3)}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;font:700 1rem var(--font-title);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar-lg{width:72px;height:72px;font-size:1.5rem}
.hero{position:relative;border-radius:var(--r-card);overflow:hidden;background:#111;color:#fff;isolation:isolate}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 100%;z-index:-2}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(17,17,17,.86) 0%,rgba(17,17,17,.5) 48%,rgba(17,17,17,.42) 100%),radial-gradient(120% 90% at 50% 50%,transparent 45%,rgba(0,0,0,.45) 100%)}
.hero::after{content:"";position:absolute;right:-30px;top:-10px;width:14px;height:140%;background:var(--brand);transform:rotate(18deg);opacity:.95;z-index:-1}
.hero-in{padding:var(--s6) var(--s4)}
.hero h1{font-size:clamp(1.75rem,6vw,3rem);max-width:15ch}
.hero .lead{margin-top:var(--s2);color:#e6e6e6;max-width:44ch}
.hero .count{display:inline-flex;align-items:center;gap:6px;margin-top:var(--s3);font-size:var(--fs-sm);font-weight:700;color:#fff}
.hero .count i{width:8px;height:8px;border-radius:50%;background:var(--brand)}
.hsearch{margin-top:var(--s5);background:var(--surface-2);color:var(--text);border-radius:var(--r-card);padding:var(--s3);box-shadow:var(--shadow-2)}
.hsearch-main{display:flex;gap:var(--s2)}
.searchbox{position:relative;flex:1;min-width:0}
.searchbox .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none}
.searchbox .input{padding-left:42px;border-radius:var(--r-pill)}
.hsearch-adv{display:none}
.hsearch-adv.open{display:block;position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:0 var(--s4) 96px}
.sheet-head{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;justify-content:space-between;height:56px;margin-bottom:var(--s3);border-bottom:1px solid var(--border);z-index:2}
.sheet-foot{position:fixed;left:0;right:0;bottom:0;padding:12px var(--s4) calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);display:flex;gap:var(--s2);z-index:2}
@media(min-width:960px){
  .hero-in{padding:var(--s12) var(--s10)}
  .hero::before{background:linear-gradient(90deg,rgba(17,17,17,.94) 0%,rgba(17,17,17,.7) 48%,rgba(17,17,17,.15) 100%),radial-gradient(120% 90% at 60% 50%,transparent 45%,rgba(0,0,0,.5) 100%)}
  .hsearch{padding:var(--s4);max-width:960px}
  .hsearch-adv{display:block;margin-top:var(--s3)}
  .hsearch-adv .sheet-head,.hsearch-adv .sheet-foot{display:none}
  .hsearch-adv .form-grid{grid-template-columns:repeat(4,1fr)}
}
.banners{display:flex;gap:var(--s3);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(var(--s4) * -1);padding-inline:var(--s4)}
.banners::-webkit-scrollbar{display:none}
.banner{flex:0 0 100%;scroll-snap-align:center;position:relative;overflow:hidden;border-radius:var(--r-card);background:#111;color:#fff;padding:var(--s5);display:grid;gap:var(--s2);align-content:center;min-height:140px}
.banner::after{content:"";position:absolute;right:28px;top:-20%;width:44px;height:140%;background:var(--brand);transform:skewX(-18deg)}
.banner::before{content:"";position:absolute;right:86px;top:-20%;width:10px;height:140%;background:var(--brand);transform:skewX(-18deg);opacity:.55}
.banner>*{position:relative;z-index:1;max-width:72%}
.banner h3{font-size:var(--fs-md)}.banner p{color:#d6d6d6;font-size:var(--fs-sm)}
.banner .btn{justify-self:start;margin-top:4px}
@media(min-width:720px){.banner{flex-basis:calc(50% - 6px);min-height:160px}}
.brandpill{display:grid;justify-items:center;gap:6px;width:72px;font-size:var(--fs-xs);font-weight:600;text-align:center;line-height:1.2}
.brandpill span{width:60px;height:60px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font:800 1rem var(--font-title);border:2px solid var(--border);transition:border-color var(--t),transform var(--t)}
.brandpill:hover span{border-color:var(--brand);transform:translateY(-2px)}
.cats{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2)}
@media(min-width:560px){.cats{grid-template-columns:repeat(4,1fr)}}
@media(min-width:960px){.cats{grid-template-columns:repeat(7,1fr)}}
.cat{display:grid;gap:4px;padding:var(--s3);border-radius:var(--r-card);background:var(--surface);border:1.5px solid transparent;transition:border-color var(--t),transform var(--t);min-height:92px;align-content:start}
.cat:hover{border-color:var(--brand);transform:translateY(-2px)}
.cat .ic{color:var(--brand-ink);width:26px;height:26px}
.cat b{font-family:var(--font-title);font-size:var(--fs-sm)}
.why{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media(min-width:640px){.why{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.why{grid-template-columns:repeat(4,1fr)}}
.why li{padding:var(--s4);border-radius:var(--r-card);background:var(--surface);display:grid;gap:6px;align-content:start}
.why .ic{width:28px;height:28px;color:var(--brand-ink)}
.gcards{display:grid;gap:var(--s3);grid-template-columns:1fr}
@media(min-width:640px){.gcards{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.gcards{grid-template-columns:repeat(3,1fr)}}
.gcard{display:flex;gap:var(--s3);align-items:center;padding:var(--s4);transition:border-color var(--t),transform var(--t)}
.gcard:hover{border-color:var(--brand);transform:translateY(-2px)}
.glogo{width:56px;height:56px;border-radius:12px;background:#111;color:#fff;display:grid;place-items:center;font:800 1.125rem var(--font-title);flex:none;overflow:hidden}
.glogo img{width:100%;height:100%;object-fit:cover}

/* ---- Carte véhicule ---- */
.grid-v{display:grid;gap:var(--s3);grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:359px){.grid-v{grid-template-columns:1fr}}
@media(min-width:720px){.grid-v{grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4)}}
@media(min-width:1100px){.grid-v.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vcard{position:relative;display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;transition:transform var(--t),box-shadow var(--t),border-color var(--t)}
.vcard:hover{box-shadow:var(--shadow-2);transform:translateY(-2px)}
.vphoto{position:relative;aspect-ratio:4/3;background:var(--photo-bg)}
.vslides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.vslides::-webkit-scrollbar{display:none}
.vslides img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;scroll-snap-align:start;background:var(--photo-bg)}
.vdots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:4px;pointer-events:none}
.vdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);box-shadow:0 0 2px rgba(0,0,0,.5)}
.vdots i.on{background:var(--brand)}
.vbadges{position:absolute;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:calc(100% - 60px);pointer-events:none}
.fav{position:absolute;right:4px;top:4px;width:44px;height:44px;display:grid;place-items:center;z-index:2}
.fav i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.94);color:#111;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform var(--t)}
.fav:active i{transform:scale(.85)}
.fav[aria-pressed=true] .ic{fill:var(--brand);color:var(--brand)}
.vbody{padding:10px 12px 12px;display:grid;gap:4px;flex:1;align-content:start}
.vtitle{font:700 var(--fs-sm)/1.3 var(--font-title);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vtitle a::after{content:"";position:absolute;inset:0;z-index:1}
.vprice{font:800 var(--fs-base)/1.2 var(--font-title);color:var(--brand-ink)}
.vmeta{display:flex;flex-wrap:wrap;gap:2px 8px;font-size:var(--fs-xs);color:var(--text-muted)}
.vmeta span{display:inline-flex;align-items:center;gap:3px}
.vmeta .ic{width:13px;height:13px}
.vfoot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:4px;font-size:var(--fs-xs);color:var(--text-muted)}
.vwa{position:relative;z-index:2;min-height:36px;padding:4px 10px;font-size:var(--fs-xs)}
@media(min-width:720px){.vtitle{font-size:var(--fs-base)}.vprice{font-size:var(--fs-md)}}
.vcard.is-row{flex-direction:row}
.vcard.is-row .vphoto{width:42%;max-width:220px;flex:none;aspect-ratio:auto;min-height:132px}
.vcard.is-row .vslides img{position:absolute;inset:0}
.vcard.is-row .vbody{min-width:0;flex:1}
.vcard.is-row .vfoot{flex-wrap:wrap}
.vcard.is-row .vfoot .vwa{flex:1 1 112px;white-space:nowrap}
.favlist{display:grid;gap:var(--s3)}
@media(min-width:960px){.favlist{grid-template-columns:1fr 1fr}}

/* ---- Skeleton ---- */
.sk{background:linear-gradient(90deg,var(--surface) 25%,var(--border) 37%,var(--surface) 63%);background-size:400% 100%;animation:sk 1.2s ease infinite;border-radius:6px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-card{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden}
.sk-card .sk-img{aspect-ratio:4/3;border-radius:0}
.sk-card .sk-l{height:12px;margin:10px 12px}

/* ---- Liste / filtres ---- */
.tabs{display:flex;gap:var(--s2);overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:calc(var(--s4) * -1);padding-inline:var(--s4)}
.tabs::-webkit-scrollbar{display:none}
.listing-layout{display:grid;gap:var(--s6)}
.filters{display:none}
.filters.open{display:block;position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:0 var(--s4) 96px}
@media(min-width:960px){
  .listing-layout{grid-template-columns:280px 1fr;align-items:start}
  .filters,.filters.open{display:block;position:sticky;top:calc(var(--top-h) + 16px);inset:auto;z-index:1;background:var(--surface);border-radius:var(--r-card);padding:var(--s4);max-height:calc(100vh - var(--top-h) - 32px);overflow:auto}
  .filters .sheet-head{position:static;background:none;height:auto;border:0}
  .filters .sheet-foot{display:none}
  .filters .sheet-head .icon-btn{display:none}
}
.toolbar{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-block:var(--s3)}
.toolbar .select{width:auto;min-width:170px}
.active-filters{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:2px 4px 2px 10px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--border);font-size:var(--fs-xs);font-weight:600}

<script>
'use strict';
/* ============ Utilitaires ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const now = () => Date.now();
const DAY = 86400000;
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const slugify = (s) => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const nfmt = (n) => String(Math.round(Number(n) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
const fcfa = (n) => nfmt(n) + '\u00A0FCFA';
const kmf = (n) => nfmt(n) + '\u00A0km';
const plural = (n, one, many) => `${nfmt(n)}\u00A0${n > 1 ? many : one}`;
const groupBy = (arr, fn) => arr.reduce((m, x) => { const k = fn(x); (m[k] = m[k] || []).push(x); return m; }, {});
const median = (a) => { const s = [...a].sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const MONTHS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const dateFr = (ts) => { const d = new Date(ts); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
const dateTimeFr = (ts) => { const d = new Date(ts); return `${dateFr(ts)}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
const monthYear = (ts) => { const d = new Date(ts); return `${MONTHS[d.getMonth()]} ${d.getFullYear()}`; };
function relDate(ts) {
  const d = now() - ts;
  if (d < 3600000) return 'à l’instant';
  if (d < DAY) return `il y a ${Math.floor(d / 3600000)} h`;
  if (d < 14 * DAY) return `il y a ${Math.floor(d / DAY)} j`;
  if (d < 60 * DAY) return `il y a ${Math.floor(d / (7 * DAY))} sem.`;
  if (d < 365 * DAY) return `il y a ${Math.floor(d / (30 * DAY))} mois`;
  const y = Math.floor(d / (365 * DAY)); return `il y a ${y} an${y > 1 ? 's' : ''}`;
}

/* Numéros ivoiriens : +225 suivi de 10 chiffres (mobiles 01/05/07, fixes 21/25/27). */
const Phone = {
  normalize(v) {
    let s = String(v ?? '').replace(/[^\d+]/g, '');
    if (s.startsWith('00225')) s = '+' + s.slice(2);
    else if (/^225\d{10}$/.test(s)) s = '+' + s;
    else if (/^(0[157]|2[157])\d{8}$/.test(s)) s = '+225' + s;
    return s;
  },
  valid(v) { return /^\+225(01|05|07|21|25|27)\d{8}$/.test(Phone.normalize(v)); },
  format(v) { const s = Phone.normalize(v); return Phone.valid(s) ? '+225 ' + s.slice(4).replace(/(\d{2})(?=\d)/g, '$1 ') : String(v ?? ''); },
  wa(v) { return Phone.normalize(v).replace('+', ''); },

/* ============ Stockage local (repli en mémoire si localStorage est bloqué) ============ */
const KV = (() => {
  const mem = {}; let ok = true;
  try { const k = '__adci_t'; localStorage.setItem(k, '1'); localStorage.removeItem(k); } catch (e) { ok = false; }
  return {
    get persistent() { return ok; },
    get(key, def) { try { const raw = ok ? localStorage.getItem(key) : mem[key]; return raw == null ? def : JSON.parse(raw); } catch (e) { return def; } },
    set(key, val) { const raw = JSON.stringify(val); if (ok) { try { localStorage.setItem(key, raw); return true; } catch (e) { mem[key] = raw; return false; } } mem[key] = raw; return true; },
    del(key) { try { if (ok) localStorage.removeItem(key); } catch (e) { /* ignoré */ } delete mem[key]; },
  };
})();
const Local = {
  data: KV.get('adci.local', {}),
  get(k, def) { return this.data[k] ?? def; },
  set(k, v) { this.data[k] = v; KV.set('adci.local', this.data); },
};
/* Limitation de débit côté client (une vraie limitation exige un serveur). */
function rateLimit(key, max, windowMs) {
  const all = Local.get('rate', {}), t = now(), list = (all[key] || []).filter((x) => t - x < windowMs);
  if (list.length >= max) return false;
  list.push(t); all[key] = list; Local.set('rate', all); return true;
}

/* ============ Médias (photos/vidéos déposées) : IndexedDB, repli mémoire ============ */
const Media = (() => {
  const urls = new Map(), mem = new Map(); let dbp = null;
  const open = () => dbp || (dbp = new Promise((res) => {
    try {
      const rq = indexedDB.open('adci-media', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('blobs');
      rq.onsuccess = () => res(rq.result); rq.onerror = () => res(null); rq.onblocked = () => res(null);
    } catch (e) { res(null); }
  }));
  const tx = async (mode, fn) => {
    const d = await open(); if (!d) return null;
    return new Promise((res) => { try { const t = d.transaction('blobs', mode), rq = fn(t.objectStore('blobs')); t.oncomplete = () => res(rq.result ?? null); t.onerror = t.onabort = () => res(null); } catch (e) { res(null); } });
  };
  return {
    async put(blob) { const id = uid('m_'); mem.set(id, blob); await tx('readwrite', (s) => s.put(blob, id)); return id; },
    async url(id) {
      if (urls.has(id)) return urls.get(id);
      const blob = mem.get(id) || await tx('readonly', (s) => s.get(id));
      if (!blob) return null;
      const u = URL.createObjectURL(blob); urls.set(id, u); return u;
    },
    async del(id) { mem.delete(id); const u = urls.get(id); if (u) { URL.revokeObjectURL(u); urls.delete(id); } await tx('readwrite', (s) => s.delete(id)); },
  };
})();

function hydrateImg(el) {

function hydrate(root) {

  root.querySelectorAll?.('video[data-ref]').forEach((v) => { const ref = v.dataset.ref; v.removeAttribute('data-ref'); Media.url(ref.slice(4)).then((u) => { if (u) v.src = u; }); });
}

let db = KV.get(DB_KEY, null);
if (!db || !db.meta || db.meta.version !== 1) { db = seedDatabase(); KV.set(DB_KEY, db); }
const saveDb = () => KV.set(DB_KEY, db);

/* ============ Couche d'accès aux données — applique les mêmes règles que les politiques RLS prévues ============ */
const fail = (msg) => { throw new Error(msg); };
const byId = (table, id) => db[table].find((x) => x.id === id) || null;
const brandOf = (l) => byId('brands', l.brand_id);
const modelOf = (l) => byId('models', l.model_id);
const catOf = (l) => byId('categories', l.category_id);
const titleOf = (l) => [brandOf(l)?.nom, modelOf(l)?.nom, l.annee].filter(Boolean).join(' ') || 'Annonce sans titre';
const modelsOf = (brandId) => db.models.filter((m) => m.brand_id === brandId);

const Auth = {
  get user() { const id = KV.get('adci.session', null); return (id && db.profiles.find((p) => p.id === id && p.statut === 'actif')) || null; },
  get isAdmin() { return this.user?.role === 'admin'; },
  requireUser() { return this.user || fail('Connectez-vous pour continuer.'); },
  requireAdmin() { return this.isAdmin ? this.user : fail('Accès réservé aux administrateurs.'); },
  signup(d) {
    const e = {};
    if (!d.nom || d.nom.trim().length < 2) e.nom = 'Indiquez votre nom.';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.email || '')) e.email = 'Adresse e-mail invalide.';
    else if (db.profiles.some((p) => p.email === d.email.trim().toLowerCase())) e.email = 'Un compte existe déjà avec cette adresse.';
    if (!d.password || d.password.length < 8) e.password = 'Le mot de passe doit contenir au moins 8 caractères.';
    if (!Phone.valid(d.telephone)) e.telephone = PHONE_ERR;
    if (!d.ville) e.ville = 'Choisissez votre ville.';
    if (!TYPES_COMPTE[d.type_compte]) e.type_compte = 'Choisissez un type de compte.';
    if (!d.consent) e.consent = 'Votre accord est nécessaire pour créer un compte.';
    if (Object.keys(e).length) { const err = new Error('Vérifiez les champs signalés.'); err.fields = e; throw err; }
    if (!rateLimit('signup', 5, 3600000)) fail('Trop de créations de compte. Réessayez dans une heure.');
    const salt = uid('s'), tel = Phone.normalize(d.telephone);
    const p = { id: uid('u_'), role: 'user', type_compte: d.type_compte, nom: d.nom.trim(), email: d.email.trim().toLowerCase(), telephone: tel, whatsapp: tel, ville: d.ville, avatar: '', statut: 'actif', created_at: now(), is_demo: false, salt, pass: hashPassword(d.password, salt), consent_at: now() };
    db.profiles.push(p);
    if (p.type_compte === 'garage') Garages.ensureFor(p);
    saveDb(); KV.set('adci.session', p.id); Favs.merge();
    return p;
  },
  login(email, password) {
    if (!rateLimit('login', 10, 600000)) fail('Trop de tentatives. Réessayez dans quelques minutes.');
    const p = db.profiles.find((x) => x.email === String(email || '').trim().toLowerCase());
    if (!p || p.pass !== hashPassword(password || '', p.salt)) fail('E-mail ou mot de passe incorrect.');
    if (p.statut !== 'actif') fail('Ce compte est suspendu. Contactez l’équipe AutoDeal CI.');
    KV.set('adci.session', p.id); Favs.merge();
    return p;
  },
  logout() { KV.del('adci.session'); },
  updateProfile(d) {
    const u = this.requireUser(), e = {};
    if (!d.nom || d.nom.trim().length < 2) e.nom = 'Indiquez votre nom.';
    if (!Phone.valid(d.telephone)) e.telephone = PHONE_ERR;
    if (d.whatsapp && !Phone.valid(d.whatsapp)) e.whatsapp = PHONE_ERR;
    if (!d.ville) e.ville = 'Choisissez votre ville.';
    if (!TYPES_COMPTE[d.type_compte]) e.type_compte = 'Choisissez un type de compte.';
    if (Object.keys(e).length) { const err = new Error('Vérifiez les champs signalés.'); err.fields = e; throw err; }
    // Liste blanche : le rôle et le statut ne sont jamais modifiables par l'utilisateur.
    Object.assign(u, { nom: d.nom.trim(), telephone: Phone.normalize(d.telephone), whatsapp: d.whatsapp ? Phone.normalize(d.whatsapp) : Phone.normalize(d.telephone), ville: d.ville, type_compte: d.type_compte });
    if (d.avatar !== undefined) u.avatar = d.avatar;
    if (u.type_compte === 'garage') Garages.ensureFor(u);
    saveDb(); return u;
  },
  changePassword(oldPw, newPw) {
    const u = this.requireUser();
    if (u.pass !== hashPassword(oldPw || '', u.salt)) fail('Mot de passe actuel incorrect.');
    if (!newPw || newPw.length < 8) fail('Le nouveau mot de passe doit contenir au moins 8 caractères.');
    u.salt = uid('s'); u.pass = hashPassword(newPw, u.salt); saveDb();
  },
  async deleteAccount() {
    const u = this.requireUser();
    if (u.role === 'admin' && db.profiles.filter((p) => p.role === 'admin').length < 2) fail('Impossible de supprimer le dernier compte administrateur.');
    await purgeUser(u.id); this.logout();
  },
};

async function purgeListing(id) {
  const l = byId('listings', id); if (!l) return;
  db.listings = db.listings.filter((x) => x.id !== id);
  const refs = [...(l.images || []), l.video].filter((r) => r && r.startsWith('idb:'));
  for (const r of refs) if (!db.listings.some((x) => (x.images || []).includes(r) || x.video === r)) await Media.del(r.slice(4));
  ['favorites', 'inquiries', 'reports', 'listing_events'].forEach((tb) => { db[tb] = db[tb].filter((x) => x.listing_id !== id); });
  Local.set('favorites', Local.get('favorites', []).filter((x) => x !== id));
  Local.set('compare', Local.get('compare', []).filter((x) => x !== id));
}
async function purgeUser(userId) {
  for (const l of db.listings.filter((x) => x.seller_id === userId)) await purgeListing(l.id);
  db.garages = db.garages.filter((g) => g.owner_id !== userId);
  ['favorites', 'notifications', 'subscriptions'].forEach((tb) => { db[tb] = db[tb].filter((x) => x.user_id !== userId); });
  db.inquiries = db.inquiries.filter((x) => x.buyer_id !== userId);
  db.payments.forEach((p) => { if (p.user_id === userId) p.user_id = null; }); // pièces comptables conservées, anonymisées
  db.profiles = db.profiles.filter((p) => p.id !== userId);
  saveDb();
}

const Notifs = {
  push(user_id, titre, message, lien = '') { db.notifications.push({ id: uid('n_'), user_id, titre, message, lien, lu: false, created_at: now() }); },
  toAdmins(titre, message, lien) { db.profiles.filter((p) => p.role === 'admin').forEach((a) => this.push(a.id, titre, message, lien)); },
  mine() { const u = Auth.user; return u ? db.notifications.filter((n) => n.user_id === u.id).sort((a, b) => b.created_at - a.created_at) : []; },
  unread() { return this.mine().filter((n) => !n.lu).length; },
  readAll() { this.mine().forEach((n) => { n.lu = true; }); saveDb(); },
};
const audit = (action, cible, details = '') => db.audit_log.push({ id: uid('a_'), admin_id: Auth.user?.id, admin_nom: Auth.user?.nom, action, cible, details, at: now() });

/* ---- Abonnements / quota ---- */
const Plans = {
  get(id) { return byId('plans', id); },
  activeSub(userId) { return db.subscriptions.find((s) => s.user_id === userId && s.statut === 'active' && s.fin > now()) || null; },
  current(userId) { const s = this.activeSub(userId); return (s && this.get(s.plan_id)) || this.get('gratuit'); },
  quotaUsed(userId) { return db.listings.filter((l) => l.seller_id === userId && ['en_attente', 'publiee'].includes(Listings.status(l))).length; },
};

/* ---- Annonces ---- */
const SELLER_FIELDS = ['brand_id', 'model_id', 'category_id', 'annee', 'prix_fcfa', 'negociable', 'km', 'carburant', 'transmission', 'cylindree', 'couleur', 'portes', 'places', 'etat', 'description', 'ville', 'commune', 'images', 'video', 'features', 'telephone', 'whatsapp'];
const STEP_FIELDS = {
  1: ['brand_id', 'model_id', 'annee', 'category_id'],
  2: ['km', 'carburant', 'transmission', 'cylindree', 'couleur', 'portes', 'places', 'etat', 'description'],
  3: ['prix_fcfa', 'ville'], 4: ['images'], 5: ['telephone', 'whatsapp'],
};
function validateListing(l, step) {
  const e = {}, num = (v) => v !== '' && v != null && !Number.isNaN(Number(v));
  const rules = {
    brand_id: () => !byId('brands', l.brand_id) && 'Choisissez une marque.',
    model_id: () => !(byId('models', l.model_id)?.brand_id === l.brand_id) && 'Choisissez un modèle.',
    annee: () => !(num(l.annee) && l.annee >= YEAR_MIN && l.annee <= YEAR_MAX) && `Indiquez une année entre ${YEAR_MIN} et ${YEAR_MAX}.`,
    category_id: () => !byId('categories', l.category_id) && 'Choisissez une carrosserie.',
    km: () => !(num(l.km) && l.km >= LIMITS.km[0] && l.km <= LIMITS.km[1]) && 'Indiquez un kilométrage entre 0 et 1 000 000 km.',
    carburant: () => !CARBURANTS.includes(l.carburant) && 'Choisissez un carburant.',
    transmission: () => !TRANSMISSIONS.includes(l.transmission) && 'Choisissez une boîte de vitesses.',
    cylindree: () => num(l.cylindree) && (l.cylindree < 0.6 || l.cylindree > 8) && 'La cylindrée doit être comprise entre 0,6 et 8 litres.',
    couleur: () => !l.couleur && 'Indiquez la couleur.',
    portes: () => !(num(l.portes) && l.portes >= 2 && l.portes <= 6) && 'Nombre de portes : entre 2 et 6.',
    places: () => !(num(l.places) && l.places >= 1 && l.places <= 20) && 'Nombre de places : entre 1 et 20.',
    etat: () => !ETATS[l.etat] && 'Précisez l’état du véhicule.',
    description: () => (l.description || '').length > 2000 && 'La description ne doit pas dépasser 2 000 caractères.',
    prix_fcfa: () => !(num(l.prix_fcfa) && l.prix_fcfa >= LIMITS.prix[0] && l.prix_fcfa <= LIMITS.prix[1]) && 'Indiquez un prix entre 300 000 et 500 000 000 FCFA.',
    ville: () => !l.ville && 'Choisissez la ville.',
    images: () => ((l.images || []).length < LIMITS.photosMin && 'Ajoutez au moins une photo (5 recommandées).') || ((l.images || []).length > LIMITS.photosMax && `Maximum ${LIMITS.photosMax} photos.`),
    telephone: () => !Phone.valid(l.telephone) && PHONE_ERR,
    whatsapp: () => l.whatsapp && !Phone.valid(l.whatsapp) && PHONE_ERR,
  };
  const fields = step ? STEP_FIELDS[step] || [] : Object.keys(rules);
  fields.forEach((f) => { const m = rules[f]?.(); if (m) e[f] = m; });
  return e;
}

const Listings = {
  isFeatured: (l) => !!l.is_featured && (!l.featured_until || l.featured_until > now()),
  isNew: (l) => !!l.publie_le && now() - l.publie_le < 7 * DAY,
  status(l) { return l.statut === 'publiee' && l.expire_le && l.expire_le < now() ? 'expiree' : l.statut; },
  sellerActive(l) { return byId('profiles', l.seller_id)?.statut === 'actif'; },
  /* Lecture publique : uniquement les annonces publiées, non expirées, de vendeurs actifs. */
  visible() { return db.listings.filter((l) => this.status(l) === 'publiee' && this.sellerActive(l)); },
  canRead(l) {
    const u = Auth.user, st = this.status(l);
    if (u && (u.role === 'admin' || u.id === l.seller_id)) return true;
    return ['publiee', 'vendue', 'expiree'].includes(st) && this.sellerActive(l);
  },
  find(key) {
    const ref = /adci-(\d{6})$/i.exec(key || '');
    const l = db.listings.find((x) => x.id === key || x.slug === key || (ref && x.reference === 'ADCI-' + ref[1]));
    return l && this.canRead(l) ? l : null;
  },
  mine() { const u = Auth.requireUser(); return db.listings.filter((l) => l.seller_id === u.id).sort((a, b) => b.updated_at - a.updated_at); },
  own(id) {
    const u = Auth.requireUser(), l = byId('listings', id);
    if (!l || l.seller_id !== u.id) fail('Cette annonce est introuvable ou ne vous appartient pas.');
    return l;
  },
  createDraft(data = {}) {
    const u = Auth.requireUser(), seq = ++db.meta.listing_seq, reference = 'ADCI-' + String(seq).padStart(6, '0');
    const l = {
      id: 'l_' + seq, reference, slug: reference.toLowerCase(), seller_id: u.id, garage_id: Garages.ofUser(u.id)?.id || null,
      brand_id: '', model_id: '', category_id: '', annee: '', prix_fcfa: '', negociable: false, km: '', carburant: '', transmission: '', cylindree: '', couleur: '', portes: 5, places: 5, etat: 'occasion',
      description: '', ville: u.ville || '', commune: '', statut: 'brouillon', motif_refus: null, is_featured: false, featured_until: null, is_demo: false, verified_at: null, verified_by: null,
      vues: 0, publie_le: null, expire_le: null, created_at: now(), updated_at: now(), images: [], video: null, features: [], telephone: u.telephone || '', whatsapp: u.whatsapp || '',
    };
    db.listings.push(l); this.patch(l, data); return l;
  },
  /* Liste blanche des champs vendeur : statut, verified_at, is_featured… ne sont jamais acceptés ici. */
  patch(l, data) {
    SELLER_FIELDS.forEach((f) => { if (f in data) l[f] = data[f]; });
    ['annee', 'prix_fcfa', 'km', 'cylindree', 'portes', 'places'].forEach((f) => { if (l[f] !== '' && l[f] != null) l[f] = Number(l[f]); });
    if (l.telephone) l.telephone = Phone.normalize(l.telephone);
    if (l.whatsapp) l.whatsapp = Phone.normalize(l.whatsapp);
    l.updated_at = now();
    l.slug = slugify([brandOf(l)?.nom, modelOf(l)?.nom, l.annee, l.ville, l.reference].filter(Boolean).join(' '));
    saveDb(); return l;
  },
  saveDraft(id, data) {
    const l = this.own(id);
    if (l.statut !== 'brouillon') fail('Seul un brouillon peut être modifié. Repassez l’annonce en brouillon pour la corriger.');
    return this.patch(l, data);
  },
  backToDraft(id) { const l = this.own(id); l.statut = 'brouillon'; l.updated_at = now(); saveDb(); return l; },
  findDuplicate(l) {
    return db.listings.find((x) => x.id !== l.id && ['en_attente', 'publiee'].includes(this.status(x)) && x.telephone && x.telephone === l.telephone
      && x.brand_id === l.brand_id && x.model_id === l.model_id && x.annee === l.annee && Math.abs(x.km - l.km) <= 1000) || null;
  },
  submit(id) {
    const l = this.own(id), u = Auth.user, errs = validateListing(l);
    if (l.statut !== 'brouillon') fail('Cette annonce a déjà été envoyée.');
    if (Object.keys(errs).length) { const err = new Error('L’annonce est incomplète : ' + Object.values(errs)[0]); err.fields = errs; throw err; }
    const dup = this.findDuplicate(l);
    if (dup) fail(`Une annonce identique existe déjà avec ce numéro (réf. ${dup.reference}). Modifiez-la plutôt que d’en créer une nouvelle.`);
    const plan = Plans.current(u.id);
    if (Plans.quotaUsed(u.id) >= plan.quota_annonces) fail(`Votre formule « ${plan.nom} » est limitée à ${plan.quota_annonces} annonces actives. Marquez une annonce comme vendue ou changez de formule.`);
    if (!rateLimit('publish', 10, 3600000)) fail('Trop d’annonces envoyées en peu de temps. Réessayez plus tard.');
    l.statut = 'en_attente'; l.motif_refus = null; l.updated_at = now();
    Notifs.toAdmins('Nouvelle annonce à modérer', `${titleOf(l)} — réf. ${l.reference}`, '/admin?onglet=moderation');
    saveDb(); return l;
  },
  markSold(id) { const l = this.own(id); if (!['publiee', 'expiree'].includes(this.status(l))) fail('Seule une annonce publiée peut être marquée comme vendue.'); l.statut = 'vendue'; l.updated_at = now(); saveDb(); return l; },
  setPrice(id, prix) {
    const l = this.own(id), p = Math.round(Number(prix));
    if (!(p >= LIMITS.prix[0] && p <= LIMITS.prix[1])) fail('Prix hors limites (300 000 à 500 000 000 FCFA).');
    l.prix_fcfa = p; l.updated_at = now(); saveDb(); return l;
  },
  duplicate(id) {
    const src = this.own(id), data = {}; SELLER_FIELDS.forEach((f) => { data[f] = Array.isArray(src[f]) ? [...src[f]] : src[f]; });
    data.video = null; return this.createDraft(data);
  },
  async remove(id) { this.own(id); await purgeListing(id); saveDb(); },

  /* ---- Actions réservées à l'administrateur ---- */
  moderate(id, decision, motif = '') {
    Auth.requireAdmin(); const l = byId('listings', id) || fail('Annonce introuvable.');
    if (decision === 'valider') {
      l.statut = 'publiee'; l.motif_refus = null; l.publie_le = now(); l.expire_le = now() + (db.site_settings.listing_duration_days || 60) * DAY;
      Notifs.push(l.seller_id, 'Annonce publiée', `Votre annonce ${titleOf(l)} (réf. ${l.reference}) est en ligne.`, '/annonces/' + l.slug);

/* ---- Recherche ---- */
const FILTER_KEYS = ['q', 'marque', 'modele', 'categorie', 'prix_min', 'prix_max', 'annee_min', 'annee_max', 'km_max', 'ville', 'carburant', 'boite', 'onglet', 'garage'];
function searchListings(f = {}, base = Listings.visible()) {
  const words = norm(f.q).split(/\s+/).filter(Boolean), n = (k) => Number(f[k]) || 0;
  const out = base.filter((l) => {
    if (f.marque && l.brand_id !== f.marque) return false;
    if (f.modele && l.model_id !== f.modele) return false;
    if (f.categorie && l.category_id !== f.categorie) return false;
    if (n('prix_min') && l.prix_fcfa < n('prix_min')) return false;
    if (n('prix_max') && l.prix_fcfa > n('prix_max')) return false;
    if (n('annee_min') && l.annee < n('annee_min')) return false;
    if (n('annee_max') && l.annee > n('annee_max')) return false;
    if (n('km_max') && l.km > n('km_max')) return false;
    if (f.ville && l.ville !== f.ville) return false;
    if (f.carburant && l.carburant !== f.carburant) return false;
    if (f.boite && l.transmission !== f.boite) return false;
    if (f.garage && l.garage_id !== f.garage) return false;
    if (f.onglet === 'recentes' && !Listings.isNew(l)) return false;
    if (f.onglet === 'neuves' && l.etat !== 'neuf') return false;
    if (f.onglet === 'occasion' && l.etat !== 'occasion') return false;
    if (f.onglet === 'verifiees' && !l.verified_at) return false;
    if (words.length) { const hay = norm(`${titleOf(l)} ${catOf(l)?.nom} ${l.ville} ${l.commune} ${l.couleur} ${l.carburant} ${l.transmission} ${l.reference} ${l.description}`); if (!words.every((w) => hay.includes(w))) return false; }
    return true;
  });
  const sorts = {
    prix_asc: (a, b) => a.prix_fcfa - b.prix_fcfa, prix_desc: (a, b) => b.prix_fcfa - a.prix_fcfa,
    annee_desc: (a, b) => b.annee - a.annee, km_asc: (a, b) => a.km - b.km, recent: (a, b) => b.publie_le - a.publie_le,
    defaut: (a, b) => (Listings.isFeatured(b) - Listings.isFeatured(a)) || (b.publie_le - a.publie_le),
  };
  return out.sort(sorts[f.tri] || sorts.defaut);
}
/* Meilleures offres : mise en avant par l'admin, ou prix ≥ 5 % sous la médiane d'un modèle ayant au moins 3 annonces en ligne. */
function bestDeals() {
  const vis = Listings.visible(), groups = groupBy(vis, (l) => l.model_id);
  const gap = (l) => { const g = groups[l.model_id]; return g.length >= 3 ? 1 - l.prix_fcfa / median(g.map((x) => x.prix_fcfa)) : 0; };
  return vis.filter((l) => Listings.isFeatured(l) || gap(l) >= 0.05).sort((a, b) => gap(b) - gap(a));
}
const favCount = (id) => db.favorites.filter((f) => f.listing_id === id).length + (!Auth.user && Local.get('favorites', []).includes(id) ? 1 : 0);
function popular() {
  const score = (l) => l.vues + 3 * favCount(l.id);
  return Listings.visible().filter((l) => score(l) > 0).sort((a, b) => score(b) - score(a));
}

    const used = { brands: (l) => l.brand_id === id, models: (l) => l.model_id === id, categories: (l) => l.category_id === id }[table];
    if (used && db.listings.some(used)) fail('Impossible de supprimer : des annonces utilisent encore cet élément.');
    if (table === 'brands') db.models = db.models.filter((m) => m.brand_id !== id);

  },

/* ---- Compression d'image côté client (≈ 1600 px, WebP sinon JPEG, qualité 80) ---- */
async function compressImage(file, maxPx = LIMITS.photoPx) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) fail('Format non pris en charge. Utilisez une photo JPEG, PNG ou WebP.');
  if (file.size > LIMITS.photoMaxMo * 1048576) fail(`Photo trop lourde (${LIMITS.photoMaxMo} Mo maximum).`);
  const url = URL.createObjectURL(file);
  try {
    const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Impossible de lire cette photo.')); i.src = url; });
    const k = Math.min(1, maxPx / Math.max(im.naturalWidth, im.naturalHeight)), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h);
    const toBlob = (type) => new Promise((res) => c.toBlob(res, type, 0.8));
    let blob = await toBlob('image/webp'); if (!blob || blob.type !== 'image/webp') blob = await toBlob('image/jpeg');
    return blob || fail('Impossible de compresser cette photo.');
  } finally { URL.revokeObjectURL(url); }
}

const LB = { refs: [], i: 0 };

  const el = document.createElement('div'); el.className = 'lightbox'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-label', 'Photos en plein écran');
  el.innerHTML = `<div class="lb-top"><span id="lb-n" aria-live="polite"></span><span class="row"><button type="button" class="icon-btn" data-action="lb-zoom" aria-label="Zoomer ou dézoomer">${icon('zoom-in')}</button><button type="button" class="icon-btn" data-action="lb-close" aria-label="Fermer">${icon('x')}</button></span></div>
    <div class="lb-stage" id="lb-stage">${refs.length > 1 ? `<button type="button" class="icon-btn gal-nav prev" data-action="lb-step" data-d="-1" aria-label="Photo précédente">${icon('chevron-left')}</button><button type="button" class="icon-btn gal-nav next" data-action="lb-step" data-d="1" aria-label="Photo suivante">${icon('chevron-right')}</button>` : ''}<span id="lb-img" data-title="${esc(title)}"></span></div>`;

function myListingRow(l, bulk) {
  const st = Listings.status(l), s = statsFor([l.id]), title = titleOf(l), view = `<a class="btn btn-outline btn-sm" href="#/annonces/${l.slug}">${icon('eye', 'ic-sm')} Voir</a>`;
  const b = (action, ic, label, cls = 'btn-outline') => `<button type="button" class="btn ${cls} btn-sm" data-action="${action}" data-id="${l.id}">${icon(ic, 'ic-sm')} ${label}</button>`;
  const pendingFeat = db.payments.some((p) => p.listing_id === l.id && p.statut === 'en_attente');
  const acts = {
    brouillon: `<a class="btn btn-primary btn-sm" href="#/compte/annonces/nouvelle?id=${l.id}">${icon('pencil', 'ic-sm')} Continuer</a>`,
    en_attente: view + b('l-edit', 'pencil', 'Modifier'),
    publiee: view + b('l-edit', 'pencil', 'Modifier') + b('l-dup', 'copy', 'Dupliquer') + b('l-sold', 'circle-check', 'Marquer vendue') + (Listings.isFeatured(l) ? '' : pendingFeat ? '<span class="st st-en_attente">Mise en avant demandée</span>' : Payments.manualEnabled() ? b('l-feature', 'megaphone', 'Mettre en avant') : ''),
    refusee: b('l-edit', 'pencil', 'Corriger', 'btn-primary'),
    vendue: view + b('l-dup', 'copy', 'Dupliquer'),
    expiree: view + b('l-dup', 'copy', 'Dupliquer') + b('l-sold', 'circle-check', 'Marquer vendue'),
  }[st];
  return `<article class="card lrow ${bulk ? '' : 'nocheck'}">${bulk ? `<input type="checkbox" name="sel" value="${l.id}" aria-label="Sélectionner ${esc(title)}" data-change="bulk-count">` : ''}
    <div class="thumb">${img(l.images?.[0], '')}</div>
    <div><div class="row between row-wrap"><h3>${esc(title)}</h3>${statusBadge(st)}</div>
      <p class="small muted">${l.prix_fcfa ? fcfa(l.prix_fcfa) : 'Prix non renseigné'} · Réf. ${esc(l.reference)} · modifiée ${relDate(l.updated_at)}${Listings.isFeatured(l) ? ' · <b>En vedette</b>' : ''}</p>
      ${st === 'refusee' && l.motif_refus ? `<p class="alert alert-danger" style="margin-top:8px">${icon('triangle-alert', 'ic-sm')}<span><b>Motif du refus :</b> ${esc(l.motif_refus)}</span></p>` : ''}

      <div class="acts">${acts}${b('l-del', 'trash-2', 'Supprimer', 'btn-danger')}</div></div></article>`;
}

const bulkIds = () => $$('#mylist input[name=sel]:checked').map((c) => c.value);

async function bulkRun(label, fn) {
  const ids = bulkIds(); if (!ids.length) return toast('Sélectionnez au moins une annonce.', { type: 'err' });
  let ok = 0, lastErr = null;
  for (const id of ids) { try { await fn(id); ok++; } catch (e) { lastErr = e; } }
  toast(`${label} : ${ok} sur ${ids.length}.${lastErr ? ' ' + lastErr.message : ''}`, { type: ok ? 'ok' : 'err', ms: 6000 }); refresh();
}
Actions['bulk-sold'] = async () => { if (bulkIds().length && await confirmDialog('Marquer la sélection comme vendue ?', 'Seules les annonces publiées seront modifiées.', { confirmLabel: 'Confirmer' })) bulkRun('Annonces marquées vendues', (id) => Listings.markSold(id)); else if (!bulkIds().length) bulkRun('', () => {}); };

Actions['bulk-price'] = async () => {
  if (!bulkIds().length) return bulkRun('', () => {});
  const ids = bulkIds(), v = await promptDialog({ title: 'Ajuster les prix', message: 'Indiquez une variation en pourcentage, par exemple -5 pour baisser de 5 % ou 3 pour augmenter de 3 %. Les prix sont arrondis au millier.', label: 'Variation (%)', textarea: false, confirmLabel: 'Appliquer' });
  if (v === null) return; const pct = Number(v.replace(',', '.').replace('%', ''));
  if (!(pct >= -90 && pct <= 100) || pct === 0) return toast('Variation invalide : saisissez un nombre entre -90 et 100.', { type: 'err' });
  ids.forEach((id) => { const c = $(`#mylist input[value="${id}"]`); if (c) c.checked = true; });
  bulkRun(`Prix ajustés de ${pct} %`, (id) => { const l = Listings.own(id); if (!l.prix_fcfa) fail('Certaines annonces n’ont pas de prix.'); Listings.setPrice(id, Math.round((l.prix_fcfa * (1 + pct / 100)) / 1000) * 1000); });
};

/* ============ Routeur (hash), délégation d'événements, démarrage ============ */
const Route = { path: '/', query: {}, params: {}, name: '', full: '/' };
const ROUTES = [
  ['home', /^\/$/, pageHome], ['listings', /^\/annonces$/, pageListings], ['detail', /^\/annonces\/([^/]+)$/, pageDetail, ['slug']],
  ['vendre', /^\/vendre$/, pageVendre], ['garages', /^\/garages$/, pageGarages], ['garage', /^\/garages\/([^/]+)$/, pageGarage, ['slug']],
  ['favoris', /^\/favoris$/, pageFavoris], ['comparer', /^\/comparer$/, pageComparer], ['login', /^\/connexion$/, pageLogin], ['signup', /^\/inscription$/, pageSignup],
  ['compte', /^\/compte$/, pageCompte], ['wizard', /^\/compte\/annonces\/nouvelle$/, pageWizard], ['admin', /^\/admin$/, pageAdmin],
  ['about', /^\/a-propos$/, pageAbout], ['contact', /^\/contact$/, pageContact], ['faq', /^\/faq$/, pageFaq],
  ['cgu', /^\/conditions-generales$/, pageCgu], ['privacy', /^\/confidentialite$/, pagePrivacy], ['legal', /^\/mentions-legales$/, pageLegal],
];
const DEFAULT_DESC = 'AutoDeal CI : la marketplace automobile de Côte d’Ivoire. Annonces modérées, vendeurs vérifiés, contact direct par WhatsApp.';
const Router = {
  stack: [], histOk: true, started: false,
  parse(full) {
    const [p, q = ''] = String(full).split('?'), query = {};
    q.split('&').filter(Boolean).forEach((kv) => { const i = kv.indexOf('='), k = i < 0 ? kv : kv.slice(0, i), v = i < 0 ? '' : kv.slice(i + 1); try { query[decodeURIComponent(k)] = decodeURIComponent(v.replace(/\+/g, ' ')); } catch (e) { /* paramètre mal formé ignoré */ } });
    return { path: p.replace(/\/+$/, '') || '/', query };
  },
  current() { const h = location.hash.slice(1); return h.startsWith('/') ? h : '/'; },
  write(full, replace) {
    try { history[replace ? 'replaceState' : 'pushState']({ adci: full }, '', '#' + full); } catch (e) { this.histOk = false; }
    if (replace && this.stack.length) this.stack[this.stack.length - 1] = full; else this.stack.push(full);
  },
  go(full, { replace = false } = {}) { this.write(full, replace); this.render(full); },
  silent(full) { this.write(full, true); Object.assign(Route, this.parse(full), { full }); },
  back() {
    if (this.stack.length < 2) return this.go('/annonces', { replace: true });
    if (this.histOk) return history.back();
    this.stack.pop(); this.render(this.stack[this.stack.length - 1]);
  },
  refresh() { this.render(Route.full, { keepScroll: true }); },
  render(full, { keepScroll = false } = {}) {
    const { path, query } = this.parse(full); let match = null;
    for (const [name, re, fn, keys = []] of ROUTES) { const m = re.exec(path); if (m) { const params = {}; keys.forEach((k, i) => { try { params[k] = decodeURIComponent(m[i + 1]); } catch (e) { params[k] = m[i + 1]; } }); match = { name, fn, params }; break; } }
